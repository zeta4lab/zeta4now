name: CI

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Public content contract
    runs-on: [self-hosted, z4aws]
    timeout-minutes: 10

    steps:
      - name: Checkout pushed content
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false

      - name: Checkout previous published content
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.before }}
          path: previous
          persist-credentials: false

      - name: Checkout trusted validator
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: validator
          persist-credentials: false

      # 공개 fork의 코드는 실행하지 않고 현재 base와 합쳐질 merge ref를 데이터로만 읽는다.
      - name: Checkout prospective merge tree as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.7"

      - name: Validate pushed content
        if: github.event_name == 'push'
        run: uv run --with markdown-it-py==4.2.0 --with pillow==12.1.0 --with pyyaml==6.0.3 python candidate/scripts/check_content.py candidate previous

      - name: Test trusted validator after merge
        if: github.event_name == 'push'
        run: uv run --with markdown-it-py==4.2.0 --with pillow==12.1.0 --with pyyaml==6.0.3 python -m unittest discover -s candidate/scripts -p 'test_*.py'

      - name: Validate proposed content with the trusted base script
        if: github.event_name == 'pull_request_target'
        run: uv run --with markdown-it-py==4.2.0 --with pillow==12.1.0 --with pyyaml==6.0.3 python validator/scripts/check_content.py candidate validator

      - name: Test trusted base validator
        if: github.event_name == 'pull_request_target'
        run: uv run --with markdown-it-py==4.2.0 --with pillow==12.1.0 --with pyyaml==6.0.3 python -m unittest discover -s validator/scripts -p 'test_*.py'
