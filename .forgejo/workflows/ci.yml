name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_WITH: --with markdown-it-py==4.2.0 --with pillow==12.1.0 --with pyyaml==6.0.3

jobs:
  content:
    name: Public content contract
    # z4mac host runner는 운영자 작업 기계라, 같은 저장소 브랜치에서 운영자(zeta)가 연 PR과 push만 실행한다.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'zeta')
    runs-on: z4mac
    timeout-minutes: 10

    steps:
      - name: Checkout pushed content
        if: github.event_name == 'push'
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: candidate
          persist-credentials: false

      - name: Checkout previous published content
        if: github.event_name == 'push'
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.before }}
          path: previous
          persist-credentials: false

      # PR의 검사 스크립트는 바꿀 수 있으므로, 검사는 main(base)에 있는 스크립트로 한다.
      - name: Checkout trusted validator
        if: github.event_name == 'pull_request'
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: validator
          persist-credentials: false

      - name: Checkout proposed content
        if: github.event_name == 'pull_request'
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Validate pushed content
        if: github.event_name == 'push'
        run: uv run $UV_WITH python candidate/scripts/check_content.py candidate previous

      - name: Test validator after merge
        if: github.event_name == 'push'
        run: uv run $UV_WITH python -m unittest discover -s candidate/scripts -p 'test_*.py'

      - name: Validate proposed content with the trusted base script
        if: github.event_name == 'pull_request'
        run: uv run $UV_WITH python validator/scripts/check_content.py candidate validator

      - name: Test trusted base validator
        if: github.event_name == 'pull_request'
        run: uv run $UV_WITH python -m unittest discover -s validator/scripts -p 'test_*.py'
